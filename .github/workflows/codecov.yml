name: "Codecov"

permissions:
  contents: read

# Enabling on each push is to display the coverage changes in every PR, 
# where each PR needs to be compared against the coverage of the head commit
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'

concurrency:
  group: codecov-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  code-coverage:
    runs-on: ubuntu-22.04

    steps:
      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace
      - run: cd libbacktrace && ./configure && make && sudo make install
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gtest
        run: |
          git clone --depth 1 -b v1.17.x https://github.com/google/googletest.git
          cmake -S googletest -B googletest/build
          cmake --build googletest/build -- -j$(nproc)
          sudo cmake --install googletest/build
      - name: Install lcov and run test
        run: |
          sudo apt-get install lcov tclx
          make lcov USE_LIBBACKTRACE=yes

      - name: Report adlist.c coverage (temporary)
        run: |
          awk '/^SF:.*\/src\/adlist\.c$/{p=1} p{print} p && /^end_of_record/{exit}' src/valkey.info > adlist.info
          echo "adlist.c lines:     $(grep '^LH:' adlist.info | cut -d: -f2) of $(grep '^LF:' adlist.info | cut -d: -f2)"
          echo "adlist.c functions: $(grep '^FNH:' adlist.info | cut -d: -f2) of $(grep '^FNF:' adlist.info | cut -d: -f2)"
          echo "adlist.c branches:  $(grep '^BRH:' adlist.info | cut -d: -f2) of $(grep '^BRF:' adlist.info | cut -d: -f2)"
          echo "uncovered lines: $(grep '^DA:' adlist.info | awk -F'[:,]' '$3==0{print $2}' | tr '\n' ' ')"
          echo "uncovered functions: $(grep '^FNDA:0,' adlist.info | cut -d, -f2 | tr '\n' ' ')"

      - name: Upload coverage data (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: |
            src/valkey.info
            adlist.info

      - name: Upload code coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/valkey.info
